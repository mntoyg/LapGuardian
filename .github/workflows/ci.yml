name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -v --cov --cov-report=term-missing

      - name: Verify the CLI starts
        run: uv run lapguardian --help

  # LapGuardian promises it makes no network requests. That promise is only
  # worth anything if something checks it, so this is a build step rather than
  # a line in the README.
  no-network-imports:
    name: No networking imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert no networking modules are imported
        run: |
          if grep -rnE '^\s*(import|from)\s+(requests|httpx|urllib|socket|aiohttp|http\.client)\b' src/; then
            echo "::error::A networking import was found in src/. See the hard rules in AGENTS.md."
            exit 1
          fi
          echo "No networking imports found."
